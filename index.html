<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Retro Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
        <div class="calculator-case">
            <div class="brand">RETRO-CALC 80</div>
            <div class="memory-indicator" id="memoryIndicator"></div>
            <input type="text" id="display" class="display" disabled>
            <div class="buttons">
                <button class="btn memory" onclick="memoryRecall()">MR</button>
                <button class="btn memory" onclick="memoryClear()">MC</button>
                <button class="btn memory" onclick="memoryAdd()">M+</button>
                <button class="btn memory" onclick="memorySubtract()">M-</button>
                
                <button class="btn" onclick="clearDisplay()">C</button>
                <button class="btn" onclick="deleteDigit()">DEL</button>
                <button class="btn" onclick="calculatePercentage()">%</button>
                <button class="btn operator" onclick="appendOperator('/')">/</button>
                
                <button class="btn" onclick="appendNumber(7)">7</button>
                <button class="btn" onclick="appendNumber(8)">8</button>
                <button class="btn" onclick="appendNumber(9)">9</button>
                <button class="btn operator" onclick="appendOperator('*')">*</button>
                
                <button class="btn" onclick="appendNumber(4)">4</button>
                <button class="btn" onclick="appendNumber(5)">5</button>
                <button class="btn" onclick="appendNumber(6)">6</button>
                <button class="btn operator" onclick="appendOperator('-')">-</button>
                
                <button class="btn" onclick="appendNumber(1)">1</button>
                <button class="btn" onclick="appendNumber(2)">2</button>
                <button class="btn" onclick="appendNumber(3)">3</button>
                <button class="btn operator" onclick="appendOperator('+')">+</button>
                
                <button class="btn" onclick="toggleSign()">+/-</button>
                <button class="btn zero" onclick="appendNumber(0)">0</button>
                <button class="btn" onclick="appendDecimal()">.</button>
                <button class="btn equal" onclick="calculate()">=</button>
                
                <button class="btn special" onclick="calculateSquareRoot()">√</button>
                <button class="btn special" onclick="calculateSquare()">x²</button>
                <button class="btn special" onclick="appendOperator('^')">xʸ</button>
            </div>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
